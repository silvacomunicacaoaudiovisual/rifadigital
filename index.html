<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Digital</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0 0 140px 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; color: white; 
            background: linear-gradient(180deg, #1abc9c 0%, #0077c2 45%, #8e44ad 100%) no-repeat center center fixed;
            background-size: cover;
        }
        .banner-topo { width: 100%; max-width: 600px; margin: 0 auto 10px auto; overflow: hidden; }
        .banner-topo img { width: 100%; height: auto; display: block; border-bottom: 2px solid #0d0d0d; }
        
        h2 { text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 5px 0; font-size: 2.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .subtitulo { color: #fffb00; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-bottom: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .rifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; max-width: 600px; margin: 0 auto; background: rgba(22, 22, 22, 0.9); padding: 20px; border-radius: 15px; border: 1px solid rgba(128, 128, 128, 0.3); }
        
        .num-btn { aspect-ratio: 1; background-color: #28a745; border: 1px solid #1e7e34; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .num-btn.selecionado { background-color: #f1c40f !important; color: black !important; border: 2px solid #fff; transform: scale(1.1); }
        .num-btn.reservado { background-color: #f39c12 !important; color: black !important; cursor: not-allowed; border: none; }
        .num-btn.pago { background-color: #e74c3c !important; color: white !important; cursor: not-allowed; border: none; }

        .legenda { display: flex; justify-content: center; gap: 15px; margin: 30px auto; flex-wrap: wrap; max-width: 600px; background: rgba(26, 26, 26, 0.85); padding: 10px 15px; border-radius: 50px; }
        .box { width: 16px; height: 16px; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 5px; }
        .verde { background: #28a745; } .laranja { background: #f39c12; } .vermelho { background: #e74c3c; }

        #footerAction { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; background: rgba(26, 26, 26, 0.95); padding: 10px; border-radius: 50px; display: none; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .btn-confirmar { width: 100%; padding: 15px; border: none; border-radius: 40px; font-weight: bold; cursor: pointer; background: #28a745; color: white; text-transform: uppercase; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 85%; max-width: 400px; border: 1px solid #333; max-height: 80vh; overflow-y: auto; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        .countdown { font-size: 28px; color: #ff3e3e; font-weight: bold; margin: 10px 0; font-family: monospace; background: rgba(255, 0, 0, 0.1); padding: 5px 15px; border-radius: 5px; display: inline-block; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 15px; color: #ccc; }
        .admin-table th { background: #28a745; color: white; padding: 8px; text-align: left; }
        .admin-table td { padding: 8px; border-bottom: 1px solid #333; }
        .btn-adm-acao { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; color: white; margin: 2px; }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="banner.jpg" alt="Banner Silva Gráfica"></div>
    <h2>RIFA DIGITAL</h2>
    <div class="subtitulo">SORTEIO DIA 10 DE MAIO APÓS O CULTO</div>
    
    <div class="rifa-grid" id="grid"></div>

    <div class="legenda">
        <span><div class="box verde"></div> Livre</span>
        <span><div class="box laranja"></div> Reservado</span>
        <span><div class="box vermelho"></div> Comprado</span>
    </div>

    <div id="footerAction">
        <button class="btn-confirmar" id="btnAcao" onclick="abrirModal()">Finalizar Reserva</button>
    </div>

    <div id="modal">
        <div class="modal-content" id="modalInterno">
            <div id="userSection">
                <h3 id="infoReserva">Confirmar Números</h3>
                <p style="color: #f1c40f; font-size: 14px;">O pagamento é via PIX!</p>
                <input type="text" id="nome" placeholder="Seu Nome Completo">
                <input type="tel" id="tel" placeholder="Seu WhatsApp">
                <input type="text" id="cpfCnpj" placeholder="CPF (Apenas números)">
                <button class="btn-confirmar" id="btnFinal" onclick="salvarReserva()">COMPRAR E PAGAR</button>
            </div>
            
            <div id="adminSection" style="display:none;">
                <h3 style="color:#1abc9c; margin-top:0;">PAINEL ADM</h3>
                <button onclick="gerarPDF()" style="background:#e74c3c; color:white; border:none; padding:10px; border-radius:5px; width:100%; font-weight:bold; cursor:pointer;">📄 BAIXAR PDF LIMPO</button>
                <table class="admin-table">
                    <thead><tr><th>Nº</th><th>Nome</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="corpoAdmin"></tbody>
                </table>
            </div>

            <button onclick="fecharModal()" style="background:none; border:none; color:#999; margin-top:20px; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <div style="margin-top: 50px; padding-bottom: 50px;">
        <button onclick="toggleAdmin()" style="background: none; border: 1px solid #444; color: #444; padding: 5px 15px; border-radius: 20px; font-size: 10px; cursor: pointer;">
            ⚙️ PAINEL ADM
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0Mr2S59WOECK487M0o-5qu14wMOEzxIA",
            authDomain: "rifadigital-1da5b.firebaseapp.com",
            databaseURL: "https://rifadigital-1da5b-default-rtdb.firebaseio.com",
            projectId: "rifadigital-1da5b",
            storageBucket: "rifadigital-1da5b.firebasestorage.app",
            messagingSenderId: "840507498009",
            appId: "1:840507498009:web:ab61aca026294ad5d45488"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let selecionados = [];

        for (let i = 1; i <= 200; i++) {
            const btn = document.createElement('button');
            btn.id = `n${i}`; btn.innerText = i; btn.className = 'num-btn';
            btn.onclick = () => clicarNumero(i);
            document.getElementById('grid').appendChild(btn);
        }

        function clicarNumero(num) {
            const btn = document.getElementById(`n${num}`);
            if (btn.classList.contains('reservado') || btn.classList.contains('pago')) return;
            if (selecionados.includes(num)) {
                selecionados = selecionados.filter(n => n !== num);
                btn.classList.remove('selecionado');
            } else {
                selecionados.push(num);
                btn.classList.add('selecionado');
            }
            document.getElementById('footerAction').style.display = selecionados.length > 0 ? 'block' : 'none';
            document.getElementById('btnAcao').innerText = `COMPRAR ${selecionados.length} NÚMERO(S)`;
        }

        function abrirModal() {
            document.getElementById('userSection').style.display = 'block';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('infoReserva').innerText = `Total: R$ ${selecionados.length * 5},00`;
            document.getElementById('modal').style.display = 'flex';
        }

        function fecharModal() { document.getElementById('modal').style.display = 'none'; }

        function toggleAdmin() {
            const senhaDefinida = "7260";
            const senhaDigitada = prompt("Digite a senha administrativa:");
            if (senhaDigitada === senhaDefinida) {
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('modal').style.display = 'flex';
                carregarAdmin();
            } else if (senhaDigitada !== null) {
                alert("Senha incorreta!");
            }
        }

        async function salvarReserva() {
            const nome = document.getElementById('nome').value;
            const tel = document.getElementById('tel').value;
            const cpfCnpj = document.getElementById('cpfCnpj').value;
            const btnFinal = document.getElementById('btnFinal');

            if (!nome || !tel || !cpfCnpj) return alert("Preencha todos os campos!");

            btnFinal.disabled = true;
            btnFinal.innerText = "GERANDO PIX...";

            const valorTotal = selecionados.length * 5;
            const numTexto = selecionados.sort((a,b) => a - b).join(', ');
            const token = '$aact_prod_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OjNkZDEzODllLWUxMGItNGNkZi05ZTM3LTdmNmJhNjVhYWZiNTo6JGFhY2hfMDI4YmY4YjUtZmUwNC00OTI1LTgyMjUtOWQxN2FkNGY3OWEw';

            try {
                // 1. Criar Cliente no Asaas
                const resCliente = await fetch('https://www.asaas.com/api/v3/customers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'access_token': token },
                    body: JSON.stringify({ name: nome, cpfCnpj: cpfCnpj, mobilePhone: tel })
                });
                const dadosCliente = await resCliente.json();
                
                if (dadosCliente.errors) throw new Error(dadosCliente.errors[0].description);

                // 2. Criar Cobrança
                const resCobranca = await fetch('https://www.asaas.com/api/v3/payments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'access_token': token },
                    body: JSON.stringify({
                        customer: dadosCliente.id,
                        billingType: 'PIX',
                        value: valorTotal,
                        dueDate: new Date().toISOString().split('T')[0],
                        description: `Rifa - Números: ${numTexto}`
                    })
                });
                const dadosCobranca = await resCobranca.json();

                if (dadosCobranca.invoiceUrl) {
                    // 3. Salvar no Firebase
                    const updates = {};
                    const agora = Date.now();
                    selecionados.forEach(n => updates[n] = { nome, tel, status: 'reservado', horario: agora, payId: dadosCobranca.id });
                    
                    await db.ref('rifa').update(updates);

                    // 4. Redirecionar para o Pagamento
                    window.location.href = dadosCobranca.invoiceUrl;
                }

            } catch (err) {
                alert("Erro: " + err.message);
                btnFinal.disabled = false;
                btnFinal.innerText = "COMPRAR";
            }
        }

        function carregarAdmin() {
            db.ref('rifa').on('value', (snap) => {
                const dados = snap.val() || {};
                const corpo = document.getElementById('corpoAdmin');
                corpo.innerHTML = "";
                Object.keys(dados).sort((a,b)=>a-b).forEach(num => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${num}</td><td>${dados[num].nome.split(' ')[0]}</td>
                        <td style="color:${dados[num].status==='pago'?'#2ecc71':'#f39c12'}">${dados[num].status==='pago'?'PAGO':'RES'}</td>
                        <td><button class="btn-adm-acao" style="background:#28a745" onclick="db.ref('rifa/${num}').update({status:'pago'})">✔</button>
                        <button class="btn-adm-acao" style="background:#555" onclick="if(confirm('Excluir?'))db.ref('rifa/${num}').remove()">🗑</button></td>`;
                    corpo.appendChild(tr);
                });
            });
        }

        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18); doc.text("RIFA DIGITAL", 14, 20);
            db.ref('rifa').once('value', (s) => {
                const d = s.val() || {}, rows = [];
                Object.keys(d).sort((a,b)=>a-b).forEach(n => rows.push([n, d[n].nome, d[n].tel, d[n].status.toUpperCase()]));
                doc.autoTable({ head: [['Nº', 'Nome', 'WhatsApp', 'Status']], body: rows, startY: 30, theme: 'grid', headStyles: { fillColor: [40, 167, 69] } });
                doc.save("vendas-silva-grafica.pdf");
            });
        }

        db.ref('rifa').on('value', (snap) => {
            const d = snap.val() || {};
            for (let i = 1; i <= 200; i++) {
                const b = document.getElementById('n' + i);
                if (d[i]) {
                    b.className = 'num-btn ' + d[i].status;
                    if (selecionados.includes(i)) selecionados = selecionados.filter(n => n !== i);
                } else if (!selecionados.includes(i)) b.className = 'num-btn';
            }
        });
    </script>
</body>
</html>
