<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Digital</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        /* --- CSS PRINCIPAL --- */
        body { 
            margin: 0; 
            padding: 0 0 140px 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            color: white; 
            background: linear-gradient(180deg, #1abc9c 0%, #0077c2 45%, #8e44ad 100%) no-repeat center center fixed;
            background-size: cover;
        }

        .banner-topo { width: 100%; max-width: 600px; margin: 0 auto 10px auto; overflow: hidden; }
        .banner-topo img { width: 100%; height: auto; display: block; border-bottom: 2px solid #0d0d0d; }
        
        h2 { color: #ffffff; text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 5px 0; font-size: 2.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .subtitulo { color: #fffb00; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .rifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; max-width: 600px; margin: 0 auto; background: rgba(22, 22, 22, 0.9); padding: 20px; border-radius: 15px; border: 1px solid rgba(128, 128, 128, 0.3); box-shadow: 0 5px 20px rgba(0,0,0,0.4); }

        .num-btn { aspect-ratio: 1; background-color: #28a745; border: 1px solid #1e7e34; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }

        .num-btn.selecionado { background-color: #f1c40f !important; color: black !important; border: 2px solid #fff; transform: scale(1.1); z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .num-btn.reservado { background-color: #f39c12 !important; color: black !important; cursor: not-allowed; border: none; }
        .num-btn.pago { background-color: #e74c3c !important; color: white !important; cursor: not-allowed; border: none; }

        .legenda { display: flex; justify-content: center; gap: 15px; margin: 30px auto; flex-wrap: wrap; max-width: 600px; background: rgba(26, 26, 26, 0.85); padding: 10px 15px; border-radius: 50px; border: 1px solid rgba(128, 128, 128, 0.2); }
        .item-legenda { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #eee; }
        .box { width: 16px; height: 16px; border-radius: 4px; }
        .verde { background: #28a745; }
        .laranja { background: #f39c12; }
        .vermelho { background: #e74c3c; }

        #footerAction { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; background: rgba(26, 26, 26, 0.95); padding: 10px; border-radius: 50px; border: 1px solid #444; display: none; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }

        .btn-confirmar { width: 100%; padding: 15px; border: none; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: 1rem; background: #28a745; color: white; text-transform: uppercase; letter-spacing: 1px; }

        /* MODAL ESTILIZADO */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; border: 1px solid #333; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }

        /* ÁREA DO PIX COPIA E COLA */
        .pix-area { display: none; background: #222; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed #f1c40f; }
        .pix-code { font-size: 0.7rem; word-break: break-all; color: #f1c40f; margin-bottom: 10px; display: block; }
        .btn-copy { background: #f1c40f; color: #000; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        
        .btn-cancelar { background: none; border: none; color: #999; margin-top: 15px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="banner-topo">
        <img src="banner.jpg" alt="Banner Silva Gráfica">
    </div>

    <h2>RIFA DIGITAL</h2>
    <div class="subtitulo">SORTEIO DIA 10 DE MAIO APÓS O CULTO</div>
    
    <div class="rifa-grid" id="grid"></div>

    <div class="legenda">
        <div class="item-legenda"><div class="box verde"></div> Livre</div>
        <div class="item-legenda"><div class="box laranja"></div> Reservado</div>
        <div class="item-legenda"><div class="box vermelho"></div> Comprado</div>
    </div>

    <div id="footerAction">
        <button class="btn-confirmar" id="btnAcao" onclick="abrirModal()">Finalizar Reserva</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="infoReserva">Confirmar Números</h3>
            <div id="formDados">
                <input type="text" id="nome" placeholder="Seu Nome Completo">
                <input type="tel" id="tel" placeholder="Seu WhatsApp">
                <button class="btn-confirmar" onclick="salvarReserva()">AVANÇAR PARA PAGAMENTO</button>
            </div>

            <div id="pixArea" class="pix-area">
                <p style="font-size: 0.8rem; color: #fff;">Pagamento via PIX Copia e Cola:</p>
                <span class="pix-code" id="pixKey">SUA_CHAVE_PIX_AQUI</span>
                <button class="btn-copy" onclick="copyPix()">COPIAR CÓDIGO PIX</button>
                <p style="font-size: 0.7rem;">Após pagar, envie o comprovante no WhatsApp!</p>
                <button class="btn-confirmar" style="background: #0077c2;" onclick="irParaInfinite()">TENTAR PELO CARTÃO</button>
            </div>

            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0Mr2S59WOECK487M0o-5qu14wMOEzxIA",
            authDomain: "rifadigital-1da5b.firebaseapp.com",
            databaseURL: "https://rifadigital-1da5b-default-rtdb.firebaseio.com",
            projectId: "rifadigital-1da5b",
            storageBucket: "rifadigital-1da5b.firebasestorage.app",
            messagingSenderId: "840507498009",
            appId: "1:840507498009:web:ab61aca026294ad5d45488"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selecionados = [];
        let globalLink = "";

        const grid = document.getElementById('grid');
        for (let i = 1; i <= 200; i++) {
            const btn = document.createElement('button');
            btn.id = `n${i}`;
            btn.innerText = i;
            btn.className = 'num-btn';
            btn.onclick = () => clicarNumero(i);
            grid.appendChild(btn);
        }

        function clicarNumero(num) {
            const btn = document.getElementById(`n${num}`);
            if (btn.classList.contains('reservado') || btn.classList.contains('pago')) return;
            if (selecionados.includes(num)) {
                selecionados = selecionados.filter(n => n !== num);
                btn.classList.remove('selecionado');
            } else {
                selecionados.push(num);
                btn.classList.add('selecionado');
            }
            const footer = document.getElementById('footerAction');
            document.getElementById('btnAcao').innerText = `RESERVAR ${selecionados.length} NÚMERO(S)`;
            footer.style.display = selecionados.length > 0 ? 'block' : 'none';
        }

        function abrirModal() {
            document.getElementById('infoReserva').innerText = `Total: R$ ${selecionados.length * 5},00`;
            document.getElementById('formDados').style.display = 'block';
            document.getElementById('pixArea').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
        }

        function fecharModal() { document.getElementById('modal').style.display = 'none'; }

        function salvarReserva() {
            const nome = document.getElementById('nome').value;
            const tel = document.getElementById('tel').value;
            if (!nome || !tel) return alert("Preencha seus dados!");

            const valorTotal = (selecionados.length * 5).toFixed(2).replace('.', ',');
            globalLink = `https://pay.infinitepay.io/silva_grafica/${valorTotal}`;

            const updates = {};
            const agora = Date.now();
            selecionados.forEach(num => {
                updates[num] = { nome, tel, status: 'reservado', horario: agora };
            });

            db.ref('rifa').update(updates).then(() => {
                // Em vez de sair da página, mostra as opções
                document.getElementById('formDados').style.display = 'none';
                document.getElementById('pixArea').style.display = 'block';
                // Opcional: Redirecionar automaticamente após 3 segundos ou deixar o usuário escolher
                setTimeout(() => { window.location.href = globalLink; }, 2000);
            });
        }

        function irParaInfinite() { window.location.href = globalLink; }

        function copyPix() {
            const code = document.getElementById('pixKey').innerText;
            navigator.clipboard.writeText(code).then(() => alert("Código PIX copiado!"));
        }

        db.ref('rifa').on('value', (snap) => {
            const dados = snap.val() || {};
            for (let i = 1; i <= 200; i++) {
                const btn = document.getElementById(`n${i}`);
                if (dados[i]) {
                    btn.className = 'num-btn ' + dados[i].status;
                    if (selecionados.includes(i)) selecionados = selecionados.filter(n => n !== i);
                } else if (!selecionados.includes(i)) {
                    btn.className = 'num-btn';
                }
            }
        });
    </script>
</body>
</html>
